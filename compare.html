<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 비교 · 전쟁 시뮬레이션(지우의 휴대폰)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 갤럭시 · 아이폰 디자인을 나란히 띄워 비교하는 페이지 */
  :root { --bg: #0b0d12; --ink: #e9ebf0; --muted: #9aa1ad; --accent: #e0566b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; display: flex; flex-direction: column; }
  header { padding: 14px 16px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 12px 12px; }
  figure { margin: 0; min-height: 0; display: flex; flex-direction: column; }
  figcaption { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 6px 0 8px; font-weight: 700; font-size: 15px; }
  figcaption a { font-weight: 500; font-size: 12.5px; color: var(--accent); }
  iframe { flex: 1; width: 100%; min-height: 0; border: 0; border-radius: 16px; background: #000; }
  @media (max-width: 820px) {
    body { height: auto; }
    .wrap { grid-template-columns: 1fr; }
    iframe { flex: none; height: 92vh; }
  }
</style>
</head>
<body>
  <header>
    <h1>디자인 비교 · 갤럭시 vs 아이폰</h1>
    <p>두 화면은 따로 움직여요. 각각 "휴대폰 열기"를 눌러 시작하세요. 소리가 겹치면 한쪽만 켜 두면 돼요.</p>
  </header>
  <div class="wrap">
    <figure>
      <figcaption>갤럭시 <a id="link-galaxy" href="index.html?style=galaxy" target="_blank" rel="noopener">따로 열기 ↗</a></figcaption>
      <iframe id="f-galaxy" src="index.html?style=galaxy" title="갤럭시 디자인"></iframe>
    </figure>
    <figure>
      <figcaption>아이폰 <a id="link-iphone" href="index.html?style=iphone" target="_blank" rel="noopener">따로 열기 ↗</a></figcaption>
      <iframe id="f-iphone" src="index.html?style=iphone" title="아이폰 디자인"></iframe>
    </figure>
  </div>
  <script>
    // compare.html?speed=10 처럼 붙인 값은 두 화면에도 그대로 전달
    (function () {
      var extra = new URLSearchParams(location.search);
      extra.delete("style");
      var q = extra.toString();
      if (!q) return;
      ["galaxy", "iphone"].forEach(function (k) {
        var url = "index.html?style=" + k + "&" + q;
        document.getElementById("f-" + k).src = url;
        document.getElementById("link-" + k).href = url;
      });
    })();
  </script>
  <!-- 방문자 수 (GoatCounter) -->
  <script data-goatcounter="https://kdh070907.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
