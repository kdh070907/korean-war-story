<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>어느 대학생의 휴대폰</title>
<meta name="description" content="가상의 상황을 그린 창작물 — 한 대학생의 휴대폰을 열어 보는 인터랙티브 픽션">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage" class="stage">
    <div id="device" class="device">
      <div id="screen" class="screen">
        <div id="statusbar" class="statusbar"></div>
        <div id="views" class="views"></div>
        <div id="freeze" class="freeze" hidden></div>
        <div id="navbar" class="navbar">
          <button data-nav="recent" aria-label="최근 앱"><svg viewBox="0 0 24 24"><path d="M5 5h3M5 5v3M19 5h-3M19 5v3M5 19h3M5 19v-3M19 19h-3M19 19v-3"/></svg></button>
          <button data-nav="home" aria-label="홈"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="4"/></svg></button>
          <button data-nav="back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        </div>
        <div id="banner" class="banner" hidden></div>
        <div id="callbar" class="callbar" hidden></div>
        <div id="overlay" class="overlay" hidden></div>
        <div id="toast" class="toast" hidden></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
